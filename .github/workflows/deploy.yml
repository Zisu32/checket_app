name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Drift Web Assets
        run: |
          # Download sqlite3.wasm and drift_worker.js required for Drift on Web
          curl -L https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.4.3/sqlite3.wasm -o web/sqlite3.wasm
          curl -L https://github.com/simolus3/drift/releases/download/drift-2.20.0/drift_worker.js -o web/drift_worker.js
          # Download coi-serviceworker to enable COOP/COEP on GitHub Pages
          curl -L https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js -o web/coi-serviceworker.js

      - name: Set Environment Variables
        run: |
          echo "DB_VERSION=$(date +%s)" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "KEY=${{ secrets.SUPABASE_ANON_KEY_PROD }}" >> $GITHUB_ENV
            echo "BASE_HREF=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
            echo "TARGET_FOLDER=." >> $GITHUB_ENV
          else
            echo "URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "KEY=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> $GITHUB_ENV
            echo "BASE_HREF=/${{ github.event.repository.name }}/dev/" >> $GITHUB_ENV
            echo "TARGET_FOLDER=dev" >> $GITHUB_ENV
          fi

      - name: Build Customer App
        run: |
          flutter build web --release \
            -t lib/main_customer.dart \
            --base-href "${{ env.BASE_HREF }}" \
            --no-source-maps \
            --dart-define=SUPABASE_URL="${{ env.URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ env.KEY }}" \
            --dart-define=DB_VERSION="${{ env.DB_VERSION }}"
          
          mkdir -p deploy_out/${{ env.TARGET_FOLDER }}
          cp -r build/web/* deploy_out/${{ env.TARGET_FOLDER }}/

      - name: Build Staff App
        run: |
          # Staff app always lives in /staff/ relative to its environment
          STAFF_BASE_HREF="${{ env.BASE_HREF }}staff/"
          
          flutter build web --release \
            -t lib/main_staff.dart \
            --base-href "$STAFF_BASE_HREF" \
            --no-source-maps \
            --dart-define=SUPABASE_URL="${{ env.URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ env.KEY }}" \
            --dart-define=DB_VERSION="${{ env.DB_VERSION }}"
          
          mkdir -p deploy_out/${{ env.TARGET_FOLDER }}/staff
          cp -r build/web/* deploy_out/${{ env.TARGET_FOLDER }}/staff/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_out
          branch: gh-pages
          clean: false # Do not delete existing files in gh-pages to allow main and dev to coexist
