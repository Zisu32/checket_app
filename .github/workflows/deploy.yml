name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Drift Web Assets
        run: |
          # Download sqlite3.wasm and drift_worker.js required for Drift on Web
          curl -L https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.4.3/sqlite3.wasm -o web/sqlite3.wasm
          curl -L https://github.com/simolus3/drift/releases/download/drift-2.20.0/drift_worker.js -o web/drift_worker.js

      - name: Set Environment Variables
        run: |
          echo "DB_VERSION=$(date +%s)" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD }}" >> $GITHUB_ENV
            echo "BASE_HREF=/" >> $GITHUB_ENV
            echo "TARGET_FOLDER=." >> $GITHUB_ENV
          else
            echo "URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_DEV }}" >> $GITHUB_ENV
            echo "BASE_HREF=/dev/" >> $GITHUB_ENV
            echo "TARGET_FOLDER=dev" >> $GITHUB_ENV
          fi

      - name: Build Customer App
        run: |
          flutter build web --release \
            -t lib/main_customer.dart \
            --base-href "${{ env.BASE_HREF }}" \
            --no-source-maps \
            --dart-define=SUPABASE_URL="${{ env.URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ env.KEY }}" \
            --dart-define=DB_VERSION="${{ env.DB_VERSION }}"
          
          mkdir -p deploy_out/${{ env.TARGET_FOLDER }}
          cp -r build/web/* deploy_out/${{ env.TARGET_FOLDER }}/

      - name: Build Staff App
        run: |
          # Staff app always lives in /staff/ relative to its environment
          STAFF_BASE_HREF="${{ env.BASE_HREF }}staff/"
          flutter build web --release \
            -t lib/main_staff.dart \
            --base-href "$STAFF_BASE_HREF" \
            --no-source-maps \
            --dart-define=SUPABASE_URL="${{ env.URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ env.KEY }}" \
            --dart-define=DB_VERSION="${{ env.DB_VERSION }}"
          
          mkdir -p deploy_out/${{ env.TARGET_FOLDER }}/staff
          cp -r build/web/* deploy_out/${{ env.TARGET_FOLDER }}/staff/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_out
          branch: gh-pages
          clean: false

  deploy-supabase:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'supabase') || github.run_attempt > 1 || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            FULL_URL="${{ secrets.SUPABASE_URL_PROD }}"
          else
            FULL_URL="${{ secrets.SUPABASE_URL_DEV }}"
          fi
          
          PROJECT_ID=$(echo $FULL_URL | sed -e 's/https:\/\///' -e 's/\.supabase\.co//')
          
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Projekt ID konnte nicht aus der URL extrahiert werden."
            exit 1
          fi
          
          supabase functions deploy --project-ref $PROJECT_ID --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
