name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy_functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Project ID
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Extract ID from https://project-id.supabase.co
            FULL_URL="${{ secrets.SUPABASE_URL_PROD }}"
            PROJECT_ID=$(echo $FULL_URL | sed -e 's/https:\/\///' -e 's/\..*//')
            echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          else
            FULL_URL="${{ secrets.SUPABASE_URL_DEV }}"
            PROJECT_ID=$(echo $FULL_URL | sed -e 's/https:\/\///' -e 's/\..*//')
            echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          fi

      # Authentication is now handled automatically via the Supabase GitHub App integration.
      # No SUPABASE_ACCESS_TOKEN secret required in this file.

      - name: Deploy generate-wallet-pass
        run: supabase functions deploy generate-wallet-pass --project-ref ${{ env.PROJECT_ID }}

      - name: Deploy sumup-terminal-pay
        run: supabase functions deploy sumup-terminal-pay --project-ref ${{ env.PROJECT_ID }}
